<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>GAME DEV PORTFOLIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- 樣式表載入前的底色保險，避免慢速網路下出現白色閃爍 -->
    <style>
        html {
            background: #131022
        }
    </style>
    <!-- 樣式與程式碼都帶時間戳記載入，確保訪客永遠拿到最新版本，
         不會被瀏覽器或 CDN 的快取擋住（圖片與 PDF 不受影響，照常快取） -->
    <script>
        var ASSET_V = Date.now();
        document.head.insertAdjacentHTML("beforeend",
            '<link rel="stylesheet" href="css/style.css?v=' + ASSET_V + '">');
    </script>
</head>

<body>

    <header>
        <div class="hud">
            <div class="hud-left">
                <div class="avatar" aria-hidden="true"></div>
                <div>
                    <h1 class="pixel">CHENG</h1>
                    <div class="sub">LV.01｜<b>Unity程式工程師</b></div>
                </div>
            </div>
            <button id="themeBtn" aria-label="切換日夜模式">
                <span id="themeIcon" aria-hidden="true">☾</span>
                <span class="lbl" id="themeLbl">NIGHT</span>
            </button>
        </div>
    </header>

    <nav aria-label="作品分類">
        <div class="tabs" role="tablist" id="tabs"></div>
    </nav>

    <main>
        <div class="grid" id="grid" role="tabpanel"></div>
    </main>

    <div id="backdrop" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <div class="modal pxb">
            <div class="pxb-in">
                <div class="m-head">
                    <h2 id="mTitle"></h2>
                    <button id="closeBtn" aria-label="關閉">✕ ESC</button>
                </div>
                <div class="m-scroll" id="mBody"></div>
            </div>
        </div>
    </div>

    <footer>© 2026 CHENG · PRESS START TO CONTINUE</footer>

    <script>
        /* async = false 讓動態插入的 script 仍依插入順序執行（data.js 先、main.js 後） */
        ["js/data.js", "js/main.js"].forEach(function (src) {
            var s = document.createElement("script");
            s.src = src + "?v=" + ASSET_V;
            s.async = false;
            document.body.appendChild(s);
        });
    </script>
</body>

</html>
